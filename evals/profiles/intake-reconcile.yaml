    role: operating contract (keystone), supplied verbatim from the repository under test
  - path: evals/profiles/eval-mode-addendum.md
    role: >
      eval-mode addendum — the ONLY sanctioned deviation surface; its exact bytes are normative
      (ADR-0049 element 3), phrased as a neutral operational note to avoid adding an explicit
      evaluation cue through the addendum itself
