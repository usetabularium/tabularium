environment_performed_steps:       # exhaustive — the addendum delegates NOTHING beyond this list.
                                   # LIST ORDER IS EXECUTION ORDER; the ownership append PRECEDES the
                                   # preflight (L13 fails closed on an un-inventoried source, so the
                                   # fixture's new image/OCR pair must be in the MANIFEST before any
                                   # guard runs), and closing-guard-check is always the FINAL step.
                                   # A harness-landing bite must prove a wrong order reds.
  - id: ownership-ledger-append
    phase: build                               # during fixture materialization, before any guard runs;
                                               # safe here because the session may never edit sources
                                               # (the pair's bytes are fixed from build onward)
    implementation: tools/person_ownership (append)
    completion_proof: verifier green over the fixture MANIFEST, recorded
    may_mutate_fixture: true                   # appends to the fixture's per-person MANIFEST (outside graded scope)
    fail_closed: true
  - id: guard-preflight
    phase: pre-session
    implementation: checks/check.sh
    completion_proof: green summary line captured in the run record
    may_mutate_fixture: false
    fail_closed: true
  - id: no-concurrent-writer
    phase: pre-session
    implementation: harness — one session per freshly built fixture tree, nothing else writes it
    completion_proof: the run's design (one trial, one tree, one session); named in the addendum
    may_mutate_fixture: false
    fail_closed: true                          # added 2026-10-05: the contract's "make sure no other
                                               # session is writing records" (full run, EV-05b-t1)
  - id: pre-edit-snapshot
    phase: pre-session
    implementation: harness pre-session copy (the lean form; run_eval copies the tree to <run root>/pre/)
    completion_proof: copy under pre/, used as the grader's before-tree
    may_mutate_fixture: false                  # the copy is taken outside the fixture root
    fail_closed: true
  - id: transcription-rebind
    phase: post-session                        # after the session, before the closing check
    implementation: tools/person_ownership (append retranscribe)   # run_eval, for each transcription
                                               # the ledger bound before the session whose bytes it changed
    completion_proof: the tool's exit code per transcription, on the run record (`rebinds`)
    may_mutate_fixture: true                   # appends to the per-person MANIFEST (outside graded scope)
    fail_closed: true                          # the tool refuses, writing nothing, without a new erratum
                                               # line or if the original's bytes moved: L13 stays red
  - id: closing-guard-check
    phase: post-session                        # ALWAYS LAST
    implementation: checks/check.sh
    completion_proof: summary line captured in the run record
    may_mutate_fixture: false
    fail_closed: true                          # a red closing check invalidates the trial (recorded invalid, never pass)
tool_policy: file-tools-only-v1    # Read/Write/Edit/Grep/Glob; no shell; no agent-accessible network
                                   # tool. Read MUST be vision-capable for image sources (see evals/README.md
                                   # → Containment requirements, item 4) — EV-02/EV-06b variants cannot count otherwise.
