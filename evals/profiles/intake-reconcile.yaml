# Profile manifest — intake-reconcile (ADR-0049 element 2)
# Enumerates every instruction surface supplied to the session and every environment-performed
# step. Instruction-surface hashes are computed at run time (surfaces legitimately change between
# runs). Binding step implementations through an evaluator manifest with transitive bundles is
# shelved (ADR-0049, *Shelved machinery* item 2).
name: intake-reconcile
description: >
  Source intake and reconciliation for one synthetic person: a new source arrives, the intake
  checklist governs, medications/profile are reconciled against it.
instruction_surfaces:
